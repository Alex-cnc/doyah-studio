# ⚠️ 本工程**不参与发布链**（2026-09-29 口径落档，队列 `L-75`）：发布走 `Scripts/build-app.sh` 的
# ad-hoc 路径，本工程只作**给人用 IDE 打开的入口**。它与 `Package.swift` 的差异登记为**已知边界**
# （`Docs/发布方案.md` §2）：`DoyahCore` 未声明 `MySQLNIO`（`Vendor/mysql-nio`）/ `CSQLite3`（`Vendor/sqlite3`）/
# `Crypto`（`swift-crypto`），目标集合也不同（`Package.swift` 9 个 vs 这里 5 个）。
# 改本文件后必须 `xcodegen generate`（生成物**不许手改**；版本号三处一致由 `Scripts/check-release-version.py` 判住）。
name: DoyahStudio
options:
  bundleIdPrefix: com.vnull
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  postGenCommand: ./Scripts/patch-xcodeproj.sh

settings:
  base:
    # XcodeGen 2.46 **不写** PRODUCT_NAME（旧工程里有 `PRODUCT_NAME = "$(TARGET_NAME)"`，
    # 而 Xcode 只会从工程里读到它 —— 缺了就解析成空串 ⇒ `xcodebuild` 报
    # 「Multiple commands produce '.../Debug/.framework/Versions'」（名字是空的）。
    # 2026-09-28 第 68 轮重生成工程时实测（队列 L-70）。
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

packages:
  PostgresNIO:
    path: Vendor/postgres-nio

# ⚠️ 各目标的 `sources` 一律带 `excludes: [".build"]` —— **点目录是构建残留，不是源码**（任务 `t_7325ffbf`）。
# 由头（2026-10-08 实测）：`platform/<平台>/` 是**自洽包**布局（`origin/migrate/platform-macos` 的树里
# `platform/macos/Package.swift` + `platform/macos/TestsUISnapshot/**` 都在 ⇒ 包根就在 `Platform/macOS`），
# 包自己那份 `.build/` 因此落在目标源目录**之内**；而 `xcodegen` **不读** `.gitignore`，不排除它就会把
# 残留里的 `.swift` 收进生成物（实测两个残留文件 ⇒ 生成物 +36 行），并**同时把判据那侧的同一条红抵消掉**
# —— 最坏的那种绿（垃圾进了入库的生成物，还没人说话）。判据侧同口径 = `Scripts/check-release-version.py`
# 的 C3（磁盘侧跳过点目录 + 反向判「生成物不许引用点目录下的 `.swift`」）。
targets:
  DoyahCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
        excludes:
          - ".build"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      # Core 依赖 PostgresNIO（跨平台），但**不依赖 Security.framework** ——
      # 系统凭据存储的实现在 DoyahPlatform 里。
      - package: PostgresNIO
        product: PostgresNIO

  DoyahPlatform:
    type: framework
    platform: macOS
    sources:
      - path: Platform/macOS
        excludes:
          - ".build"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahPlatform
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - target: DoyahCore
      - sdk: Security.framework

  DoyahStudio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "DoyahStudio.entitlements"
          # 原画与中间产物只用于重新生成图标，不打进 .app
          - "Resources/AppIcon-source.png"
          - "Resources/AppIcon-1024.png"
          # hicolor 图标集是**给 Linux 的**（App/Resources/icons/README.md 第 1 行就写着
          # 「仅 Linux」）：8 档尺寸同名 `doyahstudio.png`，进 macOS 包就是 8 条
          # 「copy 到 Resources/doyahstudio.png」⇒ `xcodebuild` 报「Multiple commands produce」。
          # macOS 用 AppIcon.icns，不需要它。
          - "Resources/icons"
          # 构建残留的点目录（口径见上面 `targets:` 前那一段）：`xcodegen` 不读 `.gitignore`。
          - ".build"
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudio
        # 发布产物的版本号（队列 L-70，2026-09-28 第 68 轮）：
        # **不要单独改这里** —— 这两个键必须与 `Scripts/build-app.sh` 的 Info.plist 模板
        # （发布产物的唯一来源）以及生成物 `DoyahStudio.xcodeproj/project.pbxproj` 里的同名键
        # 逐字一致；三处一致由 `Scripts/check-release-version.py` 机械判定（闭环第 18 项），
        # 台账 = `Scripts/release-version.json`。改了这里就必须重跑
        # `xcodegen generate`（postGenCommand 会带上 patch-xcodeproj.sh），否则 yml 与工程两处漂移。
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doyah Studio
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: App/DoyahStudio.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  DoyahStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - ".build"
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
      # 片 `云F`（任务 t_b51cd0ff）新增的 `Tests/AccountFlowTests.swift` 判的是**真界面模型**
      # （`@testable import DoyahStudioApp`）⇒ 本目标要跟 `Package.swift` 的 `DoyahCoreTests`
      # 一样带上对 App 目标的依赖（片 `云批-补正` · 任务 t_ce3ce7cc 收口；上一轮登记为已知边界）。
      - target: DoyahStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudioTests
        GENERATE_INFOPLIST_FILE: YES

  DoyahPlatformTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TestsPlatform
        excludes:
          - ".build"
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahPlatformTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DoyahCore:
    build:
      targets:
        DoyahCore: all
        DoyahPlatform: all
        DoyahStudioTests: [test]
        DoyahPlatformTests: [test]
    test:
      config: Debug
      targets:
        - DoyahStudioTests
        - DoyahPlatformTests
  DoyahStudio:
    build:
      targets:
        DoyahStudio: all
    run:
      config: Debug
