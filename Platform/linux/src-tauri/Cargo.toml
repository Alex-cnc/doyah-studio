# Doyah Studio · Linux 端应用工程（骨架片 · 派单 T-20261014-016）
#
# 归属：babyhippo（奶牙小河马）· 平台设计层 = Docs/概要设计.md §8.6 `[独占:linux]`
#
# 结构（与 §8.6.1 的层表逐行对应）：
#   .                      表示层外壳（Tauri 2 + 系统 WebView = WebKitGTK；前端与 Windows 侧**同源**）
#   Core/                  领域层（纯逻辑：零第三方依赖 / 零 UI 依赖 / 零平台能力）
#   Cli/                   无界面验证入口（子命令 + 退出码表 + --json）
#   Platform/Linux/        平台适配层（只有这一层谈 Linux 专有能力）
#
# 前端同源：本工作区**没有** App/ 目录 —— 前端就是 Windows 侧那一套
#   `Platform/windows/App/`（见 tauri.conf.json 的 build.frontendDist / devUrl）。
#   「两侧是同一套前端源码，Linux 只换外壳与平台适配层」（§8.6.1 前端复用边界）。
#   判据 = Tools/check-linux-skeleton.py 的 D 条（同源 + 本地不另存一份）。

[workspace]
resolver = "2"
members = ["Core", "Cli", "Platform/Linux"]

[package]
name = "doyah-studio-linux-shell"
version = "0.3.0"
edition = "2021"
description = "Doyah Studio Linux 侧表示层外壳（Tauri 2 + WebKitGTK；前端复用 Platform/windows/App）"
license = "UNLICENSED"
publish = false

[lib]
name = "doyah_studio_linux_shell"
path = "src/lib.rs"

[[bin]]
name = "doyah-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# **同源外壳**（概设 §9.3.1「后端同源」）：132 条命令、状态、插件面都在这里，本端不复制一份。
# 它自带 `doyah-studio-core` / `doyah-studio-db` 与 dialog 插件 —— 所以下面不再单列。
doyah-studio-shell = { path = "../../windows/App/src-tauri" }
# 本端领域层：只剩平台能力表的取值枚举（`Availability` / `CAPABILITY_NAMES`）
doyah-studio-core = { path = "Core" }
# 平台适配层：只有它谈 Linux 专有能力（WebViewGTK / 密钥环 / PTY / 通知 / 剪贴板 / 托盘）
doyah-studio-linux-platform = { path = "Platform/Linux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# 对话框插件**只作为依赖存在**（不在这里 `init()`）：`capabilities/default.json` 里的
# `dialog:default` 只认得「本 crate 直接依赖的插件」；插件实例由同源外壳 `attach()` 装一次。
# 不这么写就会在 build.rs 报 `Permission dialog:default not found`。
tauri-plugin-dialog = "2"

[features]
# Tauri 2 的「自定义协议」档：发布构建用它把前端资源嵌进可执行文件。
# 默认不开 —— 骨架片的自测（cargo test）不需要，而它会把前端产物绑进编译。
custom-protocol = ["tauri/custom-protocol"]
