[package]
name = "doyah-studio-cli"
version = "0.0.0"   # 刻意不参与「发布产物版本号一个值三处一致」的口径（那三处见 Tools/release-version.json）
edition = "2021"
description = "Doyah Studio · Windows 侧无界面验证入口（§8.5.1：子命令 + 退出码表 + --json）"
publish = false

[[bin]]
name = "doyah-studio-cli"
path = "src/main.rs"

[dependencies]
doyah-studio-core = { path = "../Core" }
# 数据库域（连接串解析 / 条件浏览 / 值检查 / CSV 解析 / DDL 生成 … 的**纯逻辑**）。
# 1.8 段把「无 GUI 也能验证领域层」这条从合成数据集扩到数据库域 —— 这些子命令
# **不连数据库**（只跑纯函数），所以 CLI 仍然零第三方依赖、不引驱动。
doyah-studio-db = { path = "../Db" }
