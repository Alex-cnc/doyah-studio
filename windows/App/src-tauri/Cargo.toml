[package]
name = "doyah-studio-shell"
version = "0.2.0"
edition = "2021"
description = "Doyah Studio Windows 侧表示层外壳（Tauri 2 外壳 + Vue 3 前端；领域层复用 ../Core）"
license = "UNLICENSED"
publish = false

[lib]
name = "doyah_studio_shell"
path = "src/lib.rs"

[[bin]]
name = "doyah-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doyah-studio-core = { path = "../../Core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
# Tauri 2 的「自定义协议」档：发布构建用它把前端资源嵌进可执行文件。
# 默认不开 —— 本侧的自测（cargo test）不需要，而它会把前端产物绑进编译。
custom-protocol = ["tauri/custom-protocol"]
