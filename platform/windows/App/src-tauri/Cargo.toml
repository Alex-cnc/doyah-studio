[package]
name = "doyah-studio-shell"
version = "0.2.0"
edition = "2021"
description = "Doyah Studio Windows 侧表示层外壳（Tauri 2 外壳 + Vue 3 前端；领域层复用 ../Core 与 ../Db）"
license = "UNLICENSED"
publish = false

[lib]
name = "doyah_studio_shell"
path = "src/lib.rs"

[[bin]]
name = "doyah-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doyah-studio-core = { path = "../../Core" }
# 数据库域的**模型层**（连接配置 / 连接串解析）—— 本层只用它的模型，不重写一份
doyah-studio-db = { path = "../../Db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# PostgreSQL 驱动（P-* 选型：纯 Rust 实现，不引 libpq / 客户端库 ⇒ 分发面小、跨平台一致）。
# **驱动只在这一层**：领域层保持零驱动（见 platform/windows/Db/Cargo.toml 的边界注记）。
tokio-postgres = { version = "0.7" }
# 结果集要**流式取**（收够上限就停），所以要流工具；版本与 tokio-postgres 自己的依赖同族
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
# Tauri 2 的「自定义协议」档：发布构建用它把前端资源嵌进可执行文件。
# 默认不开 —— 本侧的自测（cargo test）不需要，而它会把前端产物绑进编译。
custom-protocol = ["tauri/custom-protocol"]
